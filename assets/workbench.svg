<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .card-bg {
        fill: #0D1117;
        stroke: #21262D;
        stroke-width: 1.2;
      }
      .card-header {
        fill: #161B22;
      }
      .tag {
        font-size: 10px;
        fill: #8B949E;
        letter-spacing: 1.5px;
      }
      .card-title {
        font-size: 15px;
        font-weight: 700;
        fill: #F0F6FC;
        letter-spacing: 1px;
      }
      .card-desc {
        font-size: 12px;
        fill: #8B949E;
      }
      .meta-key {
        font-size: 10.5px;
        fill: #6E7681;
        letter-spacing: 1px;
      }
      .meta-val {
        font-size: 10.5px;
        fill: #C9D1D9;
        letter-spacing: 1px;
      }
      .dot-active {
        animation: pulse 2.2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- ==================== CARD 01 : INDIE GAME ==================== -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="428" height="176" rx="6" class="card-bg"/>
    <path d="M 2 8 Q 2 2 8 2 L 424 2 Q 430 2 430 8 L 430 34 L 2 34 Z" class="card-header"/>
    <line x1="2" y1="34" x2="430" y2="34" stroke="#21262D" stroke-width="1"/>

    <!-- Header bar -->
    <circle cx="18" cy="18" r="3" fill="#8B949E" class="dot-active"/>
    <text x="30" y="21.5" class="mono tag">PROC_01 // INDIE_GAME_DEV</text>
    <text x="414" y="21.5" text-anchor="end" class="mono tag">[WIP]</text>

    <!-- Title & Stack -->
    <text x="20" y="64" class="mono card-title">PROJECT // UNTITLE_01</text>
    <text x="20" y="84" class="mono meta-key">STACK: <tspan class="meta-val">Godot Engine · GDScript · ECS</tspan></text>

    <!-- Description -->
    <text x="20" y="112" class="mono card-desc">状态机、ECS 架构重构与程序化世界生成。</text>
    <text x="20" y="130" class="mono card-desc">在反复推翻与重建中推进可玩原型。</text>

    <!-- Footer status -->
    <line x1="20" y1="146" x2="412" y2="146" stroke="#21262D" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="20" y="164" class="mono meta-key">STATUS:</text>
    <text x="76" y="164" class="mono meta-val">[ 闭门造车 / ALPHA_BUILD ]</text>
  </g>

  <!-- ==================== CARD 02 : SMALL WEB & A2A ==================== -->
  <g transform="translate(450, 0)">
    <rect x="0" y="2" width="428" height="176" rx="6" class="card-bg"/>
    <path d="M 0 8 Q 0 2 6 2 L 422 2 Q 428 2 428 8 L 428 34 L 0 34 Z" class="card-header"/>
    <line x1="0" y1="34" x2="428" y2="34" stroke="#21262D" stroke-width="1"/>

    <!-- Header bar -->
    <circle cx="16" cy="18" r="3" fill="#6E7681" class="dot-active"/>
    <text x="28" y="21.5" class="mono tag">PROC_02 // EDGE_EXPERIMENTS</text>
    <text x="412" y="21.5" text-anchor="end" class="mono tag">[LIVE]</text>

    <!-- Title & Stack -->
    <text x="18" y="64" class="mono card-title">SMALL WEB &amp; A2A LABS</text>
    <text x="18" y="84" class="mono meta-key">STACK: <tspan class="meta-val">TypeScript · Cloudflare · Python</tspan></text>

    <!-- Description -->
    <text x="18" y="112" class="mono card-desc">散落在公网边缘的小型站点与自动化工作流。</text>
    <text x="18" y="130" class="mono card-desc">持续制造技术债务，偶尔解决实际问题。</text>

    <!-- Footer status -->
    <line x1="18" y1="146" x2="410" y2="146" stroke="#21262D" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="18" y="164" class="mono meta-key">STATUS:</text>
    <text x="74" y="164" class="mono meta-val">[ 维持运转 / ACCUMULATING_DEBT ]</text>
  </g>
</svg>
